<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Relay flythrough</title>
<link rel="stylesheet" href="node_modules/maplibre-gl/dist/maplibre-gl.css">
<!-- 3D flythrough of a relay: one fixed camera pose per block of legs. Data: scene.json (export_flythrough.py).
     Driven frame by frame by capture.mjs through window.renderFrame(i); window.frameCount is the total. -->
<style>
  /* --ls scales every label, --lns the route lines and the runner dot. Set from event.json's
     flythrough.label_scale and flythrough.line_scale; 1 is the design size. */
  :root { --ls: 1; --lns: 1; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0d120d; font-family: Helvetica, Arial, sans-serif; }
  #map { position: absolute; inset: 0; }
  .maplibregl-ctrl-attrib, .maplibregl-ctrl-logo { display: none !important; }
  .panel { position: absolute; left: 24px; right: 24px; background: rgba(8, 10, 10, 0.86); border-radius: 10px; color: #ebeeec; }
  #clock { top: 24px; height: calc(92px + (var(--ls) - 1) * 46px); }
  #clock .l1 { position: absolute; left: 20px; top: 16px; font-size: calc(22px * var(--ls)); line-height: calc(28px * var(--ls)); white-space: nowrap; display: flex; align-items: center; }
  #clock .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-sizing: border-box; margin-right: 10px; }
  #clock .lead { font-weight: 700; margin-right: 10px; }
  #clock .tag { font-size: 15px; font-weight: 700; color: #969e9b; margin-left: 10px; }
  #clock .l2 { position: absolute; left: 20px; top: calc(56px + (var(--ls) - 1) * 46px); font-size: calc(17px * var(--ls)); color: #969e9b; white-space: nowrap; }
  #clock .time { position: absolute; right: 20px; top: 16px; font-size: calc(22px * var(--ls)); line-height: calc(28px * var(--ls)); font-weight: 700; }
  #clock .time small { font-size: 15px; color: #969e9b; margin-left: 8px; }
  #legend { bottom: 24px; padding: 16px 20px 12px; }
  #legend .title { font-size: 22px; font-weight: 700; }
  #legend .title span { font-size: 18px; font-weight: 400; color: #969e9b; margin-left: 12px; }
  #legend .grid { display: grid; grid-template-columns: 1fr 1fr; grid-auto-flow: column; grid-template-rows: repeat(7, calc(32px * var(--ls))); column-gap: 12px; margin-top: 8px; }
  .row { display: flex; align-items: center; padding: 0 8px; border-radius: 6px; color: #afb6b3; }
  .row.on { background: rgba(255, 255, 255, 0.19); color: #ebeeec; }
  .sw { position: relative; width: 30px; height: 6px; border-radius: 3px; margin-right: 14px; flex: none; }
  .sw i { position: absolute; right: -6px; top: -3px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; box-sizing: border-box; }
  .name { font-size: calc(20px * var(--ls)); font-weight: 700; width: calc(172px * var(--ls)); flex: none; }
  .legs { font-size: calc(17px * var(--ls)); color: #969e9b; }
  #legend .credit { font-size: 14px; line-height: 19px; color: #969e9b; margin-top: 8px; }
  .ex { display: flex; align-items: center; pointer-events: none; }
  .ex .exdot { width: calc(14px * var(--ls)); height: calc(14px * var(--ls)); border-radius: 50%; background: #fff; border: 3px solid #101410; box-sizing: border-box; }
  .ex .exlabel { margin-left: 10px; font-family: Helvetica, Arial, sans-serif; font-weight: 700;
    font-size: calc(26px * var(--ls)); color: #fff; white-space: nowrap;
    /* a hard ring rather than a blur: over dark forest a soft glow just smears the stroke */
    text-shadow: -2px -2px 0 #000, 0 -2px 0 #000, 2px -2px 0 #000, 2px 0 0 #000,
                  2px 2px 0 #000, 0 2px 0 #000, -2px 2px 0 #000, -2px 0 0 #000, 0 0 7px rgba(0, 0, 0, 0.85); }
  /* place names ride on a plate in the panels' colour: the imagery under them swings from dark forest to bare
     rock to cloud, and only an opaque backing is legible across all of it */
  .place { display: flex; align-items: center; pointer-events: none; }
  .place .pbody { display: flex; align-items: center; padding: 5px 14px 5px 9px; border-radius: 999px;
    background: rgba(8, 10, 10, 0.78); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45); }
  .place .pdot { width: 9px; height: 9px; border-radius: 50%; border: 2px solid #d7ddda; box-sizing: border-box;
    margin-right: 9px; flex: none; }
  .place.flip .pbody { flex-direction: row-reverse; padding: 5px 9px 5px 14px; }
  .place.flip .pdot { margin-right: 0; margin-left: 9px; }
  .place .ptext { font-family: Helvetica, Arial, sans-serif; font-weight: 600;
    font-size: calc(19px * var(--ls)); color: #ebeeec; white-space: nowrap; }
  /* a state spans the whole frame, so it reads as spaced-out ink on the land, not as a pin on a point */
  .place.state .pbody { background: none; box-shadow: none; padding: 0; }
  .place.state .pdot { display: none; }
  .place.state .ptext { font-family: Helvetica, Arial, sans-serif; font-weight: 700;
    font-size: calc(34px * var(--ls)); letter-spacing: 7px; color: #e4e9e6;
    text-shadow: -2px -2px 0 #000, 0 -2px 0 #000, 2px -2px 0 #000, 2px 0 0 #000,
                  2px 2px 0 #000, 0 2px 0 #000, -2px 2px 0 #000, -2px 0 0 #000, 0 0 12px rgba(0, 0, 0, 0.9); }
  .runner { width: calc(24px * var(--lns)); height: calc(24px * var(--lns)); border-radius: 50%;
    border: calc(4px * var(--lns)) solid #fff; box-sizing: border-box;
    box-shadow: 0 0 0 2px #101410, 0 3px 10px rgba(0, 0, 0, 0.6); }
  /* Opening title page (flythrough.title). Everything here is driven from the frame's own clock in
     renderFrame, never from a CSS animation, so a captured frame is the same whenever it is rendered. */
  #opening { position: absolute; inset: 0; pointer-events: none; }
  #opening .scrim { position: absolute; inset: 0;
    background: linear-gradient(180deg, #1671c4 0%, #2f97dd 38%, #61bdee 72%, #a5dcf7 100%); }
  #opening.dark .scrim { background: #070b08; }
  #opening .lines { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-52%);
    padding: 0 64px; text-align: center; }
  #opening .line { will-change: opacity, transform; }
  #opening .t-kicker { font: 700 26px Helvetica, Arial, sans-serif; letter-spacing: 9px; color: #eaf7ff;
    margin-bottom: 26px; text-shadow: 0 2px 10px rgba(6, 40, 70, 0.5); }
  #opening .t-year { font: 800 148px/1 Helvetica, Arial, sans-serif; letter-spacing: 12px; color: #ffd86b;
    text-shadow: 0 6px 30px rgba(6, 40, 70, 0.55); margin-bottom: 6px; }
  #opening .t-team { font-family: Helvetica, Arial, sans-serif; font-weight: 800; line-height: 1.02;
    letter-spacing: 1px; color: #fff; text-shadow: 0 6px 30px rgba(6, 40, 70, 0.55); }
  #opening .t-rule { height: 5px; width: 170px; margin: 40px auto 34px; border-radius: 3px;
    background: linear-gradient(90deg, #199e70, #b24fc2); }
  #opening .t-stats { font: 600 32px Helvetica, Arial, sans-serif; color: #f2fbff; margin-bottom: 16px;
    text-shadow: 0 2px 10px rgba(6, 40, 70, 0.5); }
  #opening .t-result { font: 700 28px Helvetica, Arial, sans-serif; color: #ffd86b; letter-spacing: 1px;
    text-shadow: 0 2px 10px rgba(6, 40, 70, 0.5); }
  /* the starting beacon, and the baton that carries each handoff */
  .beacon { width: 0; height: 0; pointer-events: none; }
  .beacon i { position: absolute; left: 0; top: 0; border-radius: 50%; border: 3px solid #fff; box-sizing: border-box; }
  .baton { border-radius: 50%; pointer-events: none;
    box-shadow: 0 0 0 2px rgba(12, 16, 12, 0.75), 0 0 16px 3px rgba(255, 255, 255, 0.45); }
  .fw { position: relative; width: 0; height: 0; pointer-events: none; }
  .fw span { position: absolute; left: 0; top: 0; border-radius: 50%; box-shadow: 0 0 14px rgba(255, 255, 255, 0.75); }
  .fw i { position: absolute; left: 0; top: 0; border-radius: 50%; border: 3px solid #fff; box-sizing: border-box; }
  .fw b { position: absolute; left: 0; top: 0; border-radius: 50%; background: #fff;
    box-shadow: 0 0 26px 10px rgba(255, 255, 255, 0.55); }
  .ex .exbody { display: flex; align-items: center; transform-origin: left center; }
</style>
</head>
<body>
<div id="map"></div>
<div id="clock" class="panel">
  <div class="l1"><span class="dot"></span><span class="lead"></span><span class="who"></span><span class="tag"></span></div>
  <div class="l2"></div>
  <div class="time"><span class="tt"></span><small class="tz"></small></div>
</div>
<div id="legend" class="panel">
  <div class="title"></div>
  <div class="grid"></div>
  <div class="credit"></div>
</div>
<script type="module">
// maplibre-gl 6 ships only an ES module build
import * as maplibreModule from "./node_modules/maplibre-gl/dist/maplibre-gl.mjs";
const maplibregl = maplibreModule.default ?? maplibreModule;

(async () => {
  // Scene timing (seconds of video) and camera. The camera holds one fixed pose per block of legs; it only
  // moves during the TRANS seconds between blocks, and during the intro and outro.
  const D = await (await fetch("scene.json")).json();
  const OPT = D.options;
  // Applied before any layout is measured, so the label boxes and the legend height below are the real ones.
  const LS = OPT.label_scale || 1, LNS = OPT.line_scale || 1;
  document.documentElement.style.setProperty("--ls", LS);
  document.documentElement.style.setProperty("--lns", LNS);
  const W = OPT.width, H = OPT.height;
  document.documentElement.style.width = document.body.style.width = `${W}px`;
  document.documentElement.style.height = document.body.style.height = `${H}px`;
  const TITLE = OPT.title_lines || [];
  const OPENING = OPT.opening || "flyin";      // flyin (stock) | tilt | hold
  const EXCHANGE = OPT.exchange || "none";     // none | baton | firework
  // A title page needs time to read; without one the stock 3 s opening is plenty.
  const FPS = 30, INTRO = TITLE.length ? (OPT.title_seconds || 6.9) : 3.0, OUTRO = 3.5, TRANS = 1.5, BASE = OPT.base_s, PER_MI = OPT.per_mi_s;
  const BLOCK_SIZE = OPT.block_size, PITCH = OPT.pitch, ZOOM_OUT = 0.35;

  // ---------- legend first: its height sets the bottom of the clear band the camera fits each block into ----------
  const legend = document.getElementById("legend");
  legend.querySelector(".title").innerHTML = "";
  legend.querySelector(".title").append(D.team, Object.assign(document.createElement("span"), { textContent: D.event }));
  legend.querySelector(".credit").textContent = D.credit;
  legend.querySelector(".grid").style.gridTemplateRows = `repeat(${Math.ceil(D.runners.length / 2)}, 32px)`;
  const rows = {};
  for (const r of D.runners) {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<span class="sw" style="background:${r.color}"><i style="background:${r.color}"></i></span><span class="name"></span><span class="legs"></span>`;
    row.querySelector(".name").textContent = r.name;
    row.querySelector(".legs").textContent = r.legs;
    legend.querySelector(".grid").append(row);
    rows[r.name] = row;
  }
  const SAFE = { left: 80, right: 80, top: 170, bottom: legend.offsetHeight + 30 };  // clear band between the panels

  // ---------- blocks: BLOCK_SIZE legs each, a short trailing group folded into the one before it ----------
  const groups = [];
  for (let i = 0; i < D.legs.length; i += BLOCK_SIZE) groups.push(D.legs.slice(i, i + BLOCK_SIZE));
  if (groups.length > 1 && groups[groups.length - 1].length < BLOCK_SIZE) groups[groups.length - 2].push(...groups.pop());

  // ---------- timeline: each leg gets BASE + PER_MI * miles, each block boundary gets TRANS ----------
  let clockT = INTRO;
  const blocks = [], segs = [], trans = [];
  groups.forEach((legs, bi) => {
    const b = { legs, first: legs[0].n, last: legs[legs.length - 1].n, start: clockT, cam: null };
    for (const L of legs) { segs.push({ L, start: clockT, end: clockT + BASE + PER_MI * L.miles, b }); clockT = segs[segs.length - 1].end; }
    b.end = clockT;
    blocks.push(b);
    if (bi < groups.length - 1) { trans.push({ from: b, to: null, fromLeg: legs[legs.length - 1], start: clockT, end: clockT + TRANS }); clockT += TRANS; }
  });
  trans.forEach((t, i) => { t.to = blocks[i + 1]; });
  const OUTRO_START = clockT, FRAMES = Math.round((clockT + OUTRO) * FPS);

  const T = [], P = [];  // one continuous race-time -> position path across every leg
  for (const L of D.legs) L.times.forEach((s, k) => { if (!T.length || s > T[T.length - 1]) { T.push(s); P.push(L.coords[k]); } });

  function posAt(sec) {
    if (sec <= T[0]) return P[0];
    if (sec >= T[T.length - 1]) return P[P.length - 1];
    let lo = 0, hi = T.length - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (T[mid] <= sec) lo = mid; else hi = mid; }
    const f = (sec - T[lo]) / (T[hi] - T[lo]);
    return [P[lo][0] + f * (P[hi][0] - P[lo][0]), P[lo][1] + f * (P[hi][1] - P[lo][1])];
  }
  // Race time holds still through a block transition, so the runner waits at the handoff while the camera moves.
  function realAt(tau) {
    const last = D.legs[D.legs.length - 1];
    if (tau < INTRO) return D.legs[0].times[0];
    let prevEnd = D.legs[0].times[0];
    for (const s of segs) {
      if (tau < s.start) return prevEnd;
      if (tau < s.end) return s.L.times[0] + (tau - s.start) / (s.end - s.start) * (s.L.times[s.L.times.length - 1] - s.L.times[0]);
      prevEnd = s.L.times[s.L.times.length - 1];
    }
    return last.times[last.times.length - 1];
  }
  function legCoordsUntil(L, sec) {
    const out = [];
    for (let k = 0; k < L.times.length && L.times[k] <= sec; k++) out.push(L.coords[k]);
    out.push(posAt(Math.min(sec, L.times[L.times.length - 1])));
    return out.length > 1 ? out : [L.coords[0], L.coords[0]];
  }
  const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
  const wrap = a => ((a % 360) + 540) % 360 - 180;
  const ease = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  function bearing(a, b) {
    const y = Math.sin(rad(b[0] - a[0])) * Math.cos(rad(b[1]));
    const x = Math.cos(rad(a[1])) * Math.sin(rad(b[1])) - Math.sin(rad(a[1])) * Math.cos(rad(b[1])) * Math.cos(rad(b[0] - a[0]));
    return (deg(Math.atan2(y, x)) + 360) % 360;
  }
  const milesBetween = (a, b) => Math.hypot((a[1] - b[1]) * 69, (a[0] - b[0]) * 69 * Math.cos(rad(a[1])));
  function nearestMi(pl, pts) {
    let best = Infinity;
    for (const c of pts) best = Math.min(best, milesBetween([pl.lon, pl.lat], c));
    return best;
  }
  function blend(a, b, k) {
    return { center: [a.center[0] + (b.center[0] - a.center[0]) * k, a.center[1] + (b.center[1] - a.center[1]) * k],
             zoom: a.zoom + (b.zoom - a.zoom) * k, pitch: a.pitch + (b.pitch - a.pitch) * k,
             bearing: (a.bearing + wrap(b.bearing - a.bearing) * k + 360) % 360 };
  }

  // ---------- map ----------
  const line = (coords, props = {}) => ({ type: "Feature", properties: props, geometry: { type: "LineString", coordinates: coords } });
  const fc = features => ({ type: "FeatureCollection", features });
  const lineLayout = { "line-join": "round", "line-cap": "round" };
  const bounds = new maplibregl.LngLatBounds();
  D.legs.forEach(L => L.coords.forEach(c => bounds.extend(c)));
  const map = new maplibregl.Map({
    container: "map", interactive: false, attributionControl: false, fadeDuration: 0, maxPitch: 85,
    canvasContextAttributes: { preserveDrawingBuffer: true, antialias: true },
    center: bounds.getCenter(), zoom: 9,
    style: {
      version: 8,
      sources: {
        imagery: { type: "raster", tiles: [D.tiles.imagery], tileSize: 256, maxzoom: 16 },
        dem: { type: "raster-dem", tiles: [D.tiles.terrain], tileSize: 256, maxzoom: 14, encoding: "terrarium" },
        course: { type: "geojson", data: line(D.course) },
        done: { type: "geojson", data: fc([]) },
        active: { type: "geojson", data: fc([]) },
      },
      layers: [
        { id: "bg", type: "background", paint: { "background-color": "#1d2a1a" } },
        { id: "imagery", type: "raster", source: "imagery",
          // flythrough.imagery_saturation / _brightness_min / _contrast: 0 leaves the tiles untouched
          paint: { "raster-saturation": OPT.imagery_saturation || 0,
                   "raster-brightness-min": OPT.imagery_brightness_min || 0,
                   "raster-contrast": OPT.imagery_contrast || 0 } },
        { id: "course-casing", type: "line", source: "course", layout: lineLayout, paint: { "line-color": "#101410", "line-width": 6 } },
        { id: "course", type: "line", source: "course", layout: lineLayout, paint: { "line-color": "#d8d8d8", "line-width": 3 } },
        { id: "done-casing", type: "line", source: "done", layout: lineLayout, paint: { "line-color": "#101410", "line-width": 10 * LNS } },
        { id: "done", type: "line", source: "done", layout: lineLayout, paint: { "line-color": ["get", "color"], "line-width": 6 * LNS } },
        { id: "active-casing", type: "line", source: "active", layout: lineLayout, paint: { "line-color": "#101410", "line-width": 12 * LNS } },
        { id: "active", type: "line", source: "active", layout: lineLayout, paint: { "line-color": ["get", "color"], "line-width": 7 * LNS } },
      ],
      // zooming out flattens the perceived relief, so lean on the terrain harder than the follow-camera scene does
      terrain: { source: "dem", exaggeration: OPT.exaggeration },
      sky: { "sky-color": "#8fb8e0", "horizon-color": "#dfe9ee", "fog-color": "#dfe9ee",
             "sky-horizon-blend": 0.6, "horizon-fog-blend": 0.6, "fog-ground-blend": 0.85, "atmosphere-blend": 0.7 },
    },
  });
  await new Promise(resolve => map.on("load", resolve));

  function waitIdle() {
    return new Promise(resolve => {
      let finished = false;
      const done = () => { if (!finished) { finished = true; resolve(); } };
      map.once("idle", done);
      setTimeout(done, 10000);
      map.triggerRepaint();
    });
  }

  // ---------- one fixed camera pose per block ----------
  // cameraForBounds ignores pitch and terrain, so use it only as a starting pose, then measure the block's real
  // projected box and scale the zoom to the safe band, then back off a little further for breathing room.
  const CX = (SAFE.left + (W - SAFE.right)) / 2, CY = (SAFE.top + (H - SAFE.bottom)) / 2;
  const SAFE_W = W - SAFE.left - SAFE.right, SAFE_H = H - SAFE.top - SAFE.bottom;
  const inside = pts => pts.every(c => {
    const p = map.project(c);
    return p.x >= SAFE.left && p.x <= W - SAFE.right && p.y >= SAFE.top && p.y <= H - SAFE.bottom;
  });
  function screenBox(pts) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const c of pts) { const p = map.project(c); x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); }
    return { x0, y0, x1, y1 };
  }
  // A pitched camera renders a pitch-0 fit bottom-heavy, so slide the centre until the block sits in the
  // middle of the safe band. Nonlinear under pitch and terrain, hence a few passes.
  function recentre(cam, pts) {
    for (let k = 0; k < 4; k++) {
      const box = screenBox(pts);
      const dx = CX - (box.x0 + box.x1) / 2, dy = CY - (box.y0 + box.y1) / 2;
      if (Math.abs(dx) < 2 && Math.abs(dy) < 2) break;
      const c = map.unproject([W / 2 - dx, H / 2 - dy]);
      cam = { ...cam, center: [c.lng, c.lat] };
      map.jumpTo(cam);
    }
    return cam;
  }
  // ---------- place labels ----------
  // At most PLACES_MAX per block. A label only earns its spot if it is genuinely on screen under this block's
  // fixed camera, so the choice is made by projecting against that camera rather than by distance alone.
  const PLACES_MAX = 5, PLACES_MAX_MI = 18, PLACE_GAP = 20, PLACE_DY = 38 * LS;
  // A pill hangs off its dot, to the right by default and to the left when that would run off frame. Both boxes
  // below are estimated from the character count, which is close enough to keep labels off each other.
  function pillBox(p, name, flip, dy) {
    const w = name.length * 19 * LS * 0.58 + 46, h = 35 * LS;
    const x0 = flip ? p.x + 14 - w : p.x - 14;
    return { x0, x1: x0 + w, y0: p.y + dy - h / 2, y1: p.y + dy + h / 2 };
  }
  // The leg label is a dot plus text hung to the RIGHT of the leg's start point, never centred on it.
  function legLabelBox(p, text) {
    const w = 24 + text.length * 26 * LS * 0.58, h = 36 * LS;
    return { x0: p.x - 7, x1: p.x - 7 + w, y0: p.y - h / 2, y1: p.y + h / 2 };
  }
  const hits = (a, b) => a.x0 < b.x1 + PLACE_GAP && b.x0 < a.x1 + PLACE_GAP
                      && a.y0 < b.y1 + PLACE_GAP && b.y0 < a.y1 + PLACE_GAP;
  // Towns sit exactly where legs start, so a label that merely collides gets nudged off the clash rather than
  // dropped - otherwise the most useful names (the one at the start line, say) are the first to be thrown away.
  const VARIANTS = [];
  for (const dy of [0, -PLACE_DY, PLACE_DY, -2 * PLACE_DY, 2 * PLACE_DY]) for (const flip of [false, true]) VARIANTS.push({ dy, flip });
  function pickPlaces(b, blockPts) {
    const sample = blockPts.filter((_, k) => k % 8 === 0);
    // the leg label outranks every place name, so reserve the spot it takes on each of this block's legs
    const taken = b.legs.map(L => legLabelBox(map.project(L.coords[0]), `Leg ${L.n} | ${L.runner}`));
    const cand = [];
    for (const pl of D.places) {
      const d = nearestMi(pl, sample);
      if (d > PLACES_MAX_MI) continue;  // also throws out anything projected from behind a pitched camera
      const p = map.project([pl.lon, pl.lat]);
      if (!isFinite(p.x) || !isFinite(p.y)) continue;
      cand.push({ pl, p, d });
    }
    cand.sort((x, y) => x.pl.tier - y.pl.tier || x.d - y.d);
    const out = [];
    for (const c of cand) {
      if (out.length >= PLACES_MAX) break;
      for (const v of VARIANTS) {
        const box = pillBox(c.p, c.pl.name, v.flip, v.dy);
        if (box.x0 < SAFE.left - 40 || box.x1 > W - SAFE.right + 40) continue;
        if (box.y0 < SAFE.top || box.y1 > H - SAFE.bottom) continue;
        if (taken.some(t => hits(t, box))) continue;
        taken.push(box);
        out.push({ ...c.pl, flip: v.flip, dy: v.dy });
        break;
      }
    }
    return out;
  }

  for (const b of blocks) {
    const pts = [];
    for (const L of b.legs) for (const c of L.coords) pts.push(c);
    const bb = new maplibregl.LngLatBounds();
    pts.forEach(c => bb.extend(c));
    const test = pts.filter((_, k) => k % 5 === 0).concat([pts[pts.length - 1]]);
    const brg = bearing(pts[0], pts[pts.length - 1]);
    const c0 = map.cameraForBounds(bb, { padding: SAFE, bearing: brg });
    b.cam = { center: c0.center.toArray(), zoom: c0.zoom, pitch: PITCH, bearing: brg };
    map.jumpTo(b.cam);
    await waitIdle();  // load this area's DEM so project() sees real elevation while fitting
    b.cam = recentre(b.cam, test);
    for (let k = 0; k < 8; k++) {
      const box = screenBox(test);
      const scale = Math.min(SAFE_W / (box.x1 - box.x0), SAFE_H / (box.y1 - box.y0));
      if (scale > 0.98 && scale < 1.02) break;
      b.cam = { ...b.cam, zoom: b.cam.zoom + Math.log2(scale) };
      map.jumpTo(b.cam);
      b.cam = recentre(b.cam, test);
    }
    for (let k = 0; k < 24 && !inside(test); k++) {  // the scaling is nonlinear under pitch; nudge out until it really fits
      b.cam = { ...b.cam, zoom: b.cam.zoom - 0.05 };
      map.jumpTo(b.cam);
      b.cam = recentre(b.cam, test);
    }
    b.cam.zoom -= ZOOM_OUT;
    map.jumpTo(b.cam);
    await waitIdle();
    b.places = pickPlaces(b, pts);
  }
  const ov = map.cameraForBounds(bounds, { padding: { top: 200, bottom: SAFE.bottom + 40, left: 90, right: 90 }, bearing: 20 });
  const overview = { center: ov.center.toArray(), zoom: ov.zoom - 0.35, pitch: 45, bearing: 20 };

  // A state name is placed on open ground, not on the route: when a region's share of the course is short,
  // its midpoint is exactly where the runner stands at the start and the text would be stamped through by it.
  {
    map.jumpTo(overview);
    await waitIdle();
    const track = D.course.filter((_, k) => k % 20 === 0).map(c => map.project(c));
    const ring = [[0, 0]];
    for (const r of [200, 340, 480]) for (const a of [180, 0, 225, 135, 315, 45, 270, 90]) {
      ring.push([Math.round(r * Math.cos(rad(a))), Math.round(-r * Math.sin(rad(a)))]);
    }
    for (const st of D.states) {
      const p = map.project([st.lon, st.lat]);
      const w = st.name.length * (34 * LS * 0.62 + 7), h = 46 * LS;
      st.dx = 0; st.dy = 0;
      for (const [dx, dy] of ring) {
        const box = { x0: p.x + dx - w / 2, x1: p.x + dx + w / 2, y0: p.y + dy - h / 2, y1: p.y + dy + h / 2 };
        if (box.x0 < SAFE.left || box.x1 > W - SAFE.right || box.y0 < SAFE.top || box.y1 > H - SAFE.bottom) continue;
        if (track.some(q => q.x > box.x0 - 24 && q.x < box.x1 + 24 && q.y > box.y0 - 24 && q.y < box.y1 + 24)) continue;
        st.dx = dx; st.dy = dy;
        break;
      }
    }
    console.log("state labels: " + D.states.map(st => `${st.name} +(${st.dx}, ${st.dy})`).join(", "));
  }

  const blockAt = tau => blocks.find(b => tau >= b.start && tau < b.end);
  const transAt = tau => trans.find(t => tau >= t.start && tau < t.end);
  function cameraFor(tau) {
    if (tau < INTRO) {
      const k = ease(clamp01((tau - OPEN_FROM) / Math.max(0.001, OPEN_TO - OPEN_FROM)));
      if (OPENING === "hold") return blocks[0].cam;
      // "tilt": the map starts flat and overhead and tilts up into the block's own camera, so the terrain rises
      // out of a flat map. It lands exactly on blocks[0].cam, so nothing has to be cut or hidden.
      if (OPENING === "tilt") {
        const c = blocks[0].cam;
        return { center: c.center, zoom: c.zoom - 0.9 * (1 - k), pitch: c.pitch * k, bearing: c.bearing - 10 * (1 - k) };
      }
      return blend(overview, blocks[0].cam, k);
    }
    if (tau >= OUTRO_START) return blend(blocks[blocks.length - 1].cam, overview, ease(Math.min(1, (tau - OUTRO_START) / (OUTRO * 0.8))));
    const tr = transAt(tau);
    if (tr) return blend(tr.from.cam, tr.to.cam, ease((tau - tr.start) / (tr.end - tr.start)));
    return (blockAt(tau) || blocks[blocks.length - 1]).cam;
  }

  // ---------- markers and panels ----------
  // One marker per place, its opacity driven per frame. MapLibre owns the root element's opacity for terrain
  // occlusion, so the fade is applied to an inner element instead of fighting it.
  // A town can appear in two neighbouring blocks with a different placement in each, so the marker belongs to the
  // (block, place) pair rather than to the place.
  const placeBodies = new Map();
  function addPlaceMarker(id, pl) {
    const el = document.createElement("div");
    el.className = "place" + (pl.kind === "state" ? " state" : "") + (pl.flip ? " flip" : "");
    el.innerHTML = '<div class="pbody"><span class="pdot"></span><span class="ptext"></span></div>';
    el.querySelector(".ptext").textContent = pl.name;
    el.style.display = "none";
    const state = pl.kind === "state";
    new maplibregl.Marker({ element: el, anchor: state ? "center" : pl.flip ? "right" : "left",
                            offset: state ? [pl.dx || 0, pl.dy || 0] : [pl.flip ? 14 : -14, pl.dy || 0] })
      .setLngLat([pl.lon, pl.lat]).addTo(map);
    placeBodies.set(id, el.querySelector(".pbody"));
  }
  blocks.forEach((b, bi) => {
    b.ids = b.places.map(pl => `b${bi}:${pl.name}`);
    b.places.forEach((pl, k) => addPlaceMarker(b.ids[k], pl));
  });
  const stateIds = D.states.map(pl => `state:${pl.name}`);
  D.states.forEach((pl, k) => addPlaceMarker(stateIds[k], pl));
  // Town names belong to a block, so they cross-fade with the camera; the state names belong to the wide shots.
  function placeWeights(tau) {
    const w = new Map();
    const add = (ids, k) => { for (const id of ids) w.set(id, Math.max(w.get(id) || 0, k)); };
    if (tau < INTRO) {
      // the region names belong to the wide shot; the other openings never show it
      const k = OPENING === "flyin" ? ease(clamp01((tau - OPEN_FROM) / Math.max(0.001, OPEN_TO - OPEN_FROM))) : 1;
      add(stateIds, 1 - k);
      add(blocks[0].ids, k);
    } else if (tau >= OUTRO_START) {
      const k = ease(Math.min(1, (tau - OUTRO_START) / (OUTRO * 0.8)));
      add(blocks[blocks.length - 1].ids, 1 - k);
      add(stateIds, k);
    } else {
      const tr = transAt(tau);
      if (tr) {
        const k = ease((tau - tr.start) / (tr.end - tr.start));
        add(tr.from.ids, 1 - k);
        add(tr.to.ids, k);
      } else {
        add((blockAt(tau) || blocks[blocks.length - 1]).ids, 1);
      }
    }
    return w;
  }

  const runnerEl = document.createElement("div");
  runnerEl.className = "runner";
  const runnerMarker = new maplibregl.Marker({ element: runnerEl }).setLngLat(P[0]).addTo(map);
  const labelEl = document.createElement("div");
  labelEl.className = "ex";
  labelEl.innerHTML = '<div class="exbody"><div class="exdot"></div><div class="exlabel"></div></div>';
  const exBody = labelEl.querySelector(".exbody");
  const labelMarker = new maplibregl.Marker({ element: labelEl, anchor: "left", offset: [-7, 0] }).setLngLat(P[0]).addTo(map);

  const clamp01 = x => Math.max(0, Math.min(1, x));
  const outCubic = x => 1 - Math.pow(1 - x, 3);
  // How the opening is laid out. With a title page: the page holds, clears, then the camera move runs and the
  // panels slide in behind a beacon on the start line. Without one the camera move fills the whole intro.
  const TITLE_HOLD = TITLE.length ? INTRO * 0.42 : 0, REVEAL = TITLE.length ? 0.7 : 0;
  const OPEN_FROM = TITLE_HOLD + REVEAL, OPEN_TO = TITLE.length ? INTRO - 1.0 : INTRO;
  const PANELS_IN = TITLE.length ? OPEN_TO - 0.85 : -1, BEACON_AT = TITLE.length ? OPEN_TO - 0.35 : -1;

  // ---------- opening title page ----------
  const legendEl = document.getElementById("legend");
  let openingEl = null, scrimEl = null, titleEls = [];
  if (TITLE.length) {
    const runnerCount = D.runners.length;
    const fill = t => String(t).replace("__LEGS__", D.legs.length)
                               .replace("__MILES__", D.legs.reduce((a, L) => a + L.miles, 0).toFixed(1))
                               .replace("__RUNNERS__", runnerCount);
    openingEl = document.createElement("div");
    openingEl.id = "opening";
    if (OPT.title_dark) openingEl.className = "dark";
    openingEl.innerHTML = '<div class="scrim"></div><div class="lines">'
      + TITLE.map(([cls, text]) => `<div class="line ${cls}">${fill(text)}</div>`).join("") + "</div>";
    document.body.append(openingEl);
    scrimEl = openingEl.querySelector(".scrim");
    titleEls = [...openingEl.querySelectorAll(".line")];
    // sized so the longest word spans the frame minus its gutters; Helvetica Bold averages ~0.62 em per capital
    const words = TITLE.filter(([cls]) => cls === "t-team").map(([, t]) => String(t));
    if (words.length) {
      const px = Math.min(178, Math.floor((W - 130) / (Math.max(...words.map(w => w.length)) * 0.62)));
      for (const el of openingEl.querySelectorAll(".t-team")) el.style.fontSize = px + "px";
    }
  }
  // the starting beacon: rings pushing out from the start line as leg 1 begins
  const BEACONS = 3, BEACON_R = 110;
  const beaconEl = document.createElement("div");
  beaconEl.className = "beacon";
  const beaconRings = [];
  for (let i = 0; i < BEACONS; i++) { const r = document.createElement("i"); beaconEl.append(r); beaconRings.push(r); }
  new maplibregl.Marker({ element: beaconEl }).setLngLat(P[0]).addTo(map);

  // ---------- what happens at each exchange ----------
  // Both fire when the incoming leg starts - that is after any block transition, so neither smears across a
  // moving camera - and both carry the two runners' colours.
  const seeded = seed => { let x = (seed >>> 0) || 1; return () => (x = (x * 1664525 + 1013904223) >>> 0) / 4294967296; };
  const rgbOf = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mixColor = (a, b, k) => {
    const A = rgbOf(a), B = rgbOf(b);
    return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(",")})`;
  };
  // baton: a streak along the course through the exchange, in course miles - a block spans tens of miles on
  // screen, so a streak measured in pixels would be invisible
  const BATON_DUR = 1.5, BATON_MI = 1.3, BATON_LEG_SHARE = 0.45, BATON_TRAIL = 14, BATON_LAG = 0.05;
  const stretchOf = (coords, maxMi, fromEnd) => {
    const out = [fromEnd ? coords[coords.length - 1] : coords[0]];
    let d = 0;
    if (fromEnd) {
      for (let k = coords.length - 1; k > 0 && d < maxMi; k--) { d += milesBetween(coords[k], coords[k - 1]); out.unshift(coords[k - 1]); }
    } else {
      for (let k = 1; k < coords.length && d < maxMi; k++) { d += milesBetween(coords[k - 1], coords[k]); out.push(coords[k]); }
    }
    return out;
  };
  const passes = EXCHANGE === "baton" ? segs.slice(1).map((sg, i) => {
    const path = [...stretchOf(segs[i].L.coords, Math.min(BATON_MI, segs[i].L.miles * BATON_LEG_SHARE), true),
                  ...stretchOf(sg.L.coords, Math.min(BATON_MI, sg.L.miles * BATON_LEG_SHARE), false)];
    const cum = [0];
    for (let k = 1; k < path.length; k++) cum.push(cum[k - 1] + milesBetween(path[k - 1], path[k]));
    return { at: sg.start, path, cum, total: cum[cum.length - 1] || 1, cOut: segs[i].L.color, cIn: sg.L.color };
  }) : [];
  function alongPath(q, f) {
    const d = clamp01(f) * q.total;
    let lo = 0, hi = q.cum.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (q.cum[m] <= d) lo = m; else hi = m; }
    const span = q.cum[hi] - q.cum[lo] || 1, t = (d - q.cum[lo]) / span;
    return [q.path[lo][0] + t * (q.path[hi][0] - q.path[lo][0]), q.path[lo][1] + t * (q.path[hi][1] - q.path[lo][1])];
  }
  const batonEls = [], batonMarkers = [];
  if (EXCHANGE === "baton") {
    for (let i = 0; i <= BATON_TRAIL; i++) {
      const el = document.createElement("div");
      el.className = "baton"; el.style.display = "none";
      batonEls.push(el);
      batonMarkers.push(new maplibregl.Marker({ element: el }).setLngLat(P[0]).addTo(map));
    }
  }
  // firework: a flash, a shockwave ring and sparks that fly out, coast and fall
  const FW_N = 30, FW_DUR = 1.6, FW_G = 190;
  let fwEl = null, fwRing = null, fwCore = null, fwDots = [], fwMarker = null, bursts = [];
  if (EXCHANGE === "firework") {
    fwEl = document.createElement("div"); fwEl.className = "fw";
    fwRing = document.createElement("i"); fwCore = document.createElement("b");
    fwEl.append(fwRing, fwCore);
    for (let i = 0; i < FW_N; i++) { const sp = document.createElement("span"); fwEl.append(sp); fwDots.push(sp); }
    fwMarker = new maplibregl.Marker({ element: fwEl }).setLngLat(P[0]).addTo(map);
    bursts = segs.slice(1).map((sg, i) => {
      const r = seeded(sg.L.n * 2654435761);
      return { at: sg.start, lngLat: sg.L.coords[0], cIn: sg.L.color, cOut: segs[i].L.color,
               parts: Array.from({ length: FW_N }, (_, k) => ({
                 ang: (k + 0.35 + r() * 0.5) / FW_N * 2 * Math.PI,
                 speed: 175 + r() * 205, size: 7 + r() * 6, lag: r() * 0.07 })) };
    });
  }

  const clock = document.getElementById("clock");
  const $ = sel => clock.querySelector(sel);
  const fmt = new Intl.DateTimeFormat("en-US", { timeZone: D.timezone, weekday: "short", hour: "numeric", minute: "2-digit" });
  const tzFmt = new Intl.DateTimeFormat("en-US", { timeZone: D.timezone, timeZoneName: "short" });
  const tzText = sec => {
    const known = (D.tz_abbrs || []).filter(([t]) => t <= sec).pop() || (D.tz_abbrs || [])[0];
    return known ? known[1] : tzFmt.formatToParts(new Date(sec * 1000)).find(p => p.type === "timeZoneName").value;
  };
  const clockText = sec => fmt.format(new Date(sec * 1000)).replace(/[  ]/g, " ").replace(",", "");
  const totalMi = D.legs.reduce((a, L) => a + L.miles, 0).toFixed(1);
  const legRange = `Legs ${D.legs[0].n}-${D.legs[D.legs.length - 1].n}`;

  let doneKey = null;
  window.renderFrame = async i => {
    const tau = i / FPS, real = realAt(tau);
    const seg = segs.find(s => tau >= s.start && tau < s.end);
    const tr = transAt(tau);
    const finished = segs.filter(s => tau >= s.end).map(s => s.L);
    const key = finished.length;
    if (key !== doneKey) {
      map.getSource("done").setData(fc([...D.context.map(c => line(c.coords, { color: c.color })),
                                        ...finished.map(L => line(L.coords, { color: L.color }))]));
      doneKey = key;
    }
    const cur = seg ? seg.L : null;
    map.getSource("active").setData(fc(cur ? [line(legCoordsUntil(cur, real), { color: cur.color })] : []));

    // during a block transition the panels stay on the leg that just finished, matching the frozen race clock
    const info = cur || (tr ? tr.fromLeg : null);
    const b = (blockAt(tau) || (tr ? tr.from : null) || blocks[0]);
    const L = info || (tau < INTRO ? D.legs[0] : D.legs[D.legs.length - 1]);
    runnerEl.style.background = L.color;
    runnerEl.style.display = tau >= OUTRO_START ? "none" : "block";
    runnerMarker.setLngLat(posAt(real));
    labelEl.style.display = info ? "flex" : "none";
    labelMarker.setLngLat(L.coords[0]);
    labelEl.querySelector(".exlabel").textContent = `Leg ${L.n} | ${L.runner}`;

    $(".dot").style.background = L.color;
    if (info) {
      $(".lead").textContent = `Leg ${L.n}`;
      $(".who").textContent = L.runner;
      $(".tag").textContent = L.tag;
      $(".l2").textContent = [`${L.miles} mi`, L.rating, `${L.pace} /mi`, L.van !== "" ? `Van ${L.van}` : "", `Legs ${b.first}-${b.last}`].filter(Boolean).join(" | ");
    } else {
      $(".lead").textContent = tau < INTRO ? D.team : legRange;
      $(".who").textContent = tau < INTRO ? `${legRange} in 3D` : "finished";
      $(".tag").textContent = "";
      $(".l2").textContent = `${D.event} | ${D.legs.length} legs | ${totalMi} mi | ${blocks.length} blocks`;
    }
    const weights = placeWeights(tau);
    for (const [id, body] of placeBodies) {
      const a = weights.get(id) || 0;
      body.parentElement.style.display = a > 0.01 ? "flex" : "none";
      body.style.opacity = a.toFixed(3);
    }

    $(".tt").textContent = clockText(real);
    $(".tz").textContent = tzText(real);
    for (const [name, row] of Object.entries(rows)) row.classList.toggle("on", !!info && name === L.runner);

    // ---------- the opening page, the panels sliding in, and the beacon on the start line ----------
    if (TITLE.length && tau < INTRO) {
      const page = tau < TITLE_HOLD ? 0.97 : 0.97 * (1 - outCubic(clamp01((tau - TITLE_HOLD) / REVEAL)));
      openingEl.style.display = "block";
      scrimEl.style.opacity = page.toFixed(3);
      // Every line is at full opacity on frame 0, so the video's first frame - what a player shows before you
      // press play - is the finished card. The entrance is carried by position and scale settling instead.
      const gone = outCubic(clamp01((tau - (TITLE_HOLD + REVEAL * 0.3)) / 0.8));
      titleEls.forEach((el, i) => {
        const k = outCubic(clamp01((tau - i * 0.24) / 0.9));
        el.style.opacity = (1 - gone).toFixed(3);
        el.style.transform = `translateY(${((1 - k) * 26).toFixed(1)}px) scale(${(1 + (1 - k) * 0.045).toFixed(4)})`;
      });
      const pin = outCubic(clamp01((tau - PANELS_IN) / 1.1));
      clock.style.transform = `translateY(${(-(1 - pin) * 180).toFixed(1)}px)`;
      legendEl.style.transform = `translateY(${((1 - pin) * 320).toFixed(1)}px)`;
    } else if (openingEl && openingEl.style.display !== "none") {
      openingEl.style.display = "none";
      clock.style.transform = "none";
      legendEl.style.transform = "none";
    }
    if (BEACON_AT >= 0) {
      const bt = tau - BEACON_AT;
      beaconRings.forEach((ring, i) => {
        const k = (bt - i * 0.42) / 1.25;
        if (bt < 0 || k <= 0 || k >= 1) { ring.style.display = "none"; return; }
        const r = BEACON_R * outCubic(k);
        ring.style.display = "block";
        ring.style.width = ring.style.height = (r * 2).toFixed(1) + "px";
        ring.style.marginLeft = ring.style.marginTop = (-r).toFixed(1) + "px";
        ring.style.opacity = ((1 - k) * 0.85).toFixed(3);
      });
    }

    // ---------- the leg label pops in as its leg begins ----------
    if (OPT.leg_label_pop && info && seg) {
      const k = Math.min(1, (tau - seg.start) / 0.45), c1 = 1.70158, c3 = c1 + 1;
      const back = 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2);  // ease out back
      exBody.style.transform = `scale(${(0.55 + 0.45 * back).toFixed(3)})`;
      exBody.style.opacity = Math.min(1, k * 1.8).toFixed(3);
    }

    // ---------- the exchange ----------
    if (EXCHANGE === "baton") {
      const pass = passes.find(q => tau >= q.at && tau < q.at + BATON_DUR);
      if (!pass) {
        for (const el of batonEls) el.style.display = "none";
      } else {
        const head = ease(Math.min(1, (tau - pass.at) / BATON_DUR));
        const fade = 1 - Math.max(0, (head - 0.82) / 0.18);
        for (let i = 0; i <= BATON_TRAIL; i++) {
          const f = head - i * BATON_LAG, el = batonEls[i];
          if (f <= 0) { el.style.display = "none"; continue; }
          const sz = (i === 0 ? 21 : 16) * LNS * (1 - i / (BATON_TRAIL + 3));
          el.style.display = "block";
          el.style.width = el.style.height = sz.toFixed(1) + "px";
          // the trail lags the head, so it is still the outgoing colour while the head is already the new one
          el.style.background = i === 0 ? "#fff" : mixColor(pass.cOut, pass.cIn, Math.min(1, f));
          el.style.opacity = (fade * Math.max(0, 1 - i / (BATON_TRAIL + 1.5))).toFixed(3);
          batonMarkers[i].setLngLat(alongPath(pass, f));
        }
      }
    } else if (EXCHANGE === "firework") {
      const burst = bursts.find(b => tau >= b.at && tau < b.at + FW_DUR);
      fwEl.style.display = burst ? "block" : "none";
      if (burst) {
        fwMarker.setLngLat(burst.lngLat);
        const t = tau - burst.at, f = t / FW_DUR;
        const ringR = 16 + 104 * (1 - Math.pow(1 - Math.min(t / 0.62, 1), 3));
        fwRing.style.width = fwRing.style.height = (ringR * 2).toFixed(1) + "px";
        fwRing.style.marginLeft = fwRing.style.marginTop = (-ringR).toFixed(1) + "px";
        fwRing.style.borderColor = burst.cIn;
        fwRing.style.opacity = Math.max(0, 1 - t / 0.62).toFixed(3);
        const coreR = 34 * Math.max(0, 1 - t / 0.22);
        fwCore.style.width = fwCore.style.height = (coreR * 2).toFixed(1) + "px";
        fwCore.style.marginLeft = fwCore.style.marginTop = (-coreR).toFixed(1) + "px";
        fwCore.style.opacity = Math.max(0, 1 - t / 0.22).toFixed(3);
        burst.parts.forEach((q, k) => {
          const tt = Math.max(0, t - q.lag);
          const drag = (1 - Math.exp(-tt * 1.9)) / 1.9;  // sparks fly out fast, then coast and fall
          const sz = q.size * (1 - 0.45 * f);
          const el = fwDots[k];
          el.style.width = el.style.height = sz.toFixed(2) + "px";
          el.style.transform = `translate(${(Math.cos(q.ang) * q.speed * drag - sz / 2).toFixed(2)}px, `
                             + `${(Math.sin(q.ang) * q.speed * drag + FW_G * tt * tt * 0.5 - sz / 2).toFixed(2)}px)`;
          el.style.background = k % 2 ? burst.cIn : burst.cOut;
          el.style.opacity = (tt > 0 ? Math.max(0, 1 - Math.pow(f, 1.7)) : 0).toFixed(3);
        });
      }
    }

    map.jumpTo(cameraFor(tau));
    await waitIdle();
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    return true;
  };
  window.frameCount = FRAMES;
  window.sceneReady = true;
  console.log(`scene ready: ${blocks.length} blocks (${blocks.map(b => `${b.first}-${b.last}`).join(", ")}), `
            + `${FRAMES} frames, ${(FRAMES / FPS).toFixed(1)} s`);
  console.log("block zooms: " + blocks.map(b => b.cam.zoom.toFixed(2)).join(", "));
  for (const b of blocks) console.log(`  legs ${b.first}-${b.last}: ${b.places.map(p => p.name).join(", ") || "(no places)"}`);
})().catch(e => { window.sceneError = e.message; console.log("scene error: " + e.message); });
</script>
</body>
